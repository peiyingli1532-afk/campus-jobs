<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招 · 官网投递岗位筛选器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div>
        <h1>校招岗位筛选器</h1>
        <p class="subtitle">北上广深 · 香港 ｜ 官网 / 官方公众号直投 ｜ 27届秋招 · 非技术岗</p>
      </div>
      <span class="badge-official">官网直投</span>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabBrowse" onclick="switchTab('browse')">岗位浏览</button>
    <button class="tab" id="tabMatch" onclick="switchTab('match')">简历匹配</button>
    <button class="tab" id="tabDash" onclick="switchTab('dash')">数据看板</button>
  </div>

  <div id="browseView">
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box">
        <span class="icon"></span>
        <input id="search" type="text" maxlength="200" placeholder="搜索公司名 / 岗位 / 行业 / JD关键词…">
      </div>
      <select id="sortSelect" class="btn">
        <option value="publish">按发布时间</option>
        <option value="default">默认排序</option>
        <option value="name">按公司名</option>
        <option value="status">按投递状态</option>
      </select>
      <button class="btn ghost" id="favBtn">只看收藏</button>
      <button class="btn ghost" id="resetBtn" title="清空全部筛选">重置</button>
      <button class="btn primary" id="addBtn">＋ 新增</button>
      <button class="btn" id="exportBtn">导出</button>
      <button class="btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div class="filter-group">
      <span class="filter-label">城市</span>
      <div class="chips" id="cityChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">行业</span>
      <div class="chips" id="industryChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">岗位类别</span>
      <div class="chips" id="roleChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">投递状态</span>
      <div class="chips" id="statusChips"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>
  </div>

  <div id="matchView" style="display:none">
    <div class="match-panel">
      <label class="upload-zone" for="resumeFile">
        <input type="file" id="resumeFile" accept=".pdf,.docx" hidden>
        <div class="upload-hint">点击选择简历文件（支持 PDF / Word .docx）</div>
        <div class="upload-name" id="uploadName" style="display:none"></div>
      </label>
      <div class="match-actions">
        <button class="btn primary" onclick="analyzeResume()">分析匹配</button>
        <button class="btn ghost" onclick="clearResume()">清空</button>
      </div>
      <div id="resumeSummary"></div>
      <div id="matchResults"></div>
      <div id="resumeAdvice"></div>
      <hr class="section-divider">
      <h3 class="dash-title">岗位 JD 匹配（比一比投哪个岗位最匹配）</h3>
      <p class="hint">粘贴多个岗位 JD：每个用「岗位名：XXX」开头命名，不同岗位之间用一行「====」分隔</p>
      <textarea id="jdInput" class="resume-input" placeholder="岗位名：腾讯-产品经理
负责XX产品需求分析、竞品分析、PRD撰写…

====
岗位名：美团-用户运营
负责用户增长、活动策划、社群运营…"></textarea>
      <div class="key-row">
        <input id="apiKeyInput" type="password" placeholder="DeepSeek API Key（只存本机浏览器，不上传）">
        <button class="btn" onclick="saveApiKey()">保存 Key</button>
      </div>
      <div class="match-actions">
        <button class="btn primary" onclick="analyzeJDMatch()">分析 JD 匹配</button>
        <button class="btn ghost" onclick="clearJD()">清空</button>
      </div>
      <div id="jdResults"></div>
    </div>
  </div>

  <div id="dashView" style="display:none">
    <div class="dash-section">
      <h3 class="dash-title">投递状态分布（横版条形图）</h3>
      <div id="statusChart"></div>
    </div>
    <div class="dash-section">
      <h3 class="dash-title">投递状态明细（哪些公司 · 哪些岗位）</h3>
      <div id="statusTable"></div>
    </div>
  </div>

  <footer>数据每日 9:00 自动更新 · 具体岗位/截止/薪资以各公司官方渠道为准 · 投递状态保存在浏览器本地</footer>
</div>

<!-- 新增/编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新增公司</h2>
    <div class="field">
      <label for="f_name">公司名 <em>必填</em></label>
      <input id="f_name" type="text" placeholder="如：腾讯">
    </div>
    <div class="field">
      <label for="f_en">英文名 / 简称</label>
      <input id="f_en" type="text" placeholder="如：Tencent（可留空）">
    </div>
    <div class="field">
      <label for="f_city">城市 <em>多个用逗号分隔</em></label>
      <input id="f_city" type="text" placeholder="北京, 上海, 广州, 深圳, 香港">
    </div>
    <div class="field">
      <label for="f_ind">行业 <em>多个用逗号分隔</em></label>
      <input id="f_ind" type="text" placeholder="互联网, 科技, 金融, 快消, 制造, 汽车, 医药, 咨询">
    </div>
    <div class="field">
      <label for="f_role">岗位类别 <em>多个用逗号分隔</em></label>
      <input id="f_role" type="text" placeholder="产品, 运营, 销售, 管培生, 职能">
    </div>
    <div class="field">
      <label for="f_url">投递链接</label>
      <input id="f_url" type="text" placeholder="官网 或 公众号文章链接 https://…">
    </div>
    <div class="field">
      <label for="f_src">来源类型</label>
      <select id="f_src">
        <option value="官网">企业官网</option>
        <option value="公众号">微信公众号</option>
      </select>
    </div>
    <div class="field">
      <label for="f_desc">校招项目 / 岗位说明</label>
      <textarea id="f_desc" placeholder="如：2027校园招聘，产品/运营/职能方向…"></textarea>
    </div>
    <div class="field">
      <label for="f_deadline">截止日期</label>
      <input id="f_deadline" type="text" placeholder="如：招满即止 / 以官网为准">
    </div>
    <div class="field">
      <label for="f_salary">薪资 <em>如有</em></label>
      <input id="f_salary" type="text" placeholder="如：以官网为准">
    </div>
    <div class="field">
      <label for="f_note">备注</label>
      <input id="f_note" type="text" placeholder="如：入口以官网为准（可留空）">
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
