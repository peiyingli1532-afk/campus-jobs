<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校招 · 官网投递岗位筛选器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e6e8ec;
    --text: #1f2329;
    --muted: #7a8088;
    --accent: #2563eb;
    --accent-soft: #eef4ff;
    --green: #16a34a;
    --green-soft: #eaf7ef;
    --chip-hover: #eef0f3;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 80px; }

  header { margin-bottom: 20px; }
  h1 { margin: 0 0 6px; font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .badge-official {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--green-soft); color: var(--green);
    font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  }
  .badge-official::before { content: ""; font-weight: 700; }

  /* 搜索 + 工具栏 */
  .toolbar {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); position: sticky; top: 12px; z-index: 5;
  }
  .search-row { display: flex; gap: 10px; align-items: center; }
  .search-box { position: relative; flex: 1; }
  .search-box input {
    width: 100%; padding: 9px 12px 9px 34px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 9px; outline: none; background: #fbfbfd;
  }
  .search-box input:focus { border-color: var(--accent); background: #fff; }
  .search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .btn {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 13px; border-radius: 9px; font-size: 13px; cursor: pointer; white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--chip-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: var(--chip-hover); }
  .btn.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .btn.ghost.on { color: #2563eb; background: #eef4ff; }
  .fav-btn.on { color: #d97706; border-color: #fbbf24; background: #fffbeb; }

  /* 筛选组 */
  .filter-group { margin-top: 12px; display: flex; align-items: flex-start; gap: 10px; }
  .filter-label { flex: 0 0 auto; font-size: 13px; color: var(--muted); padding-top: 6px; width: 64px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 5px 12px; font-size: 13px; border-radius: 999px; cursor: pointer; user-select: none;
    background: #f2f3f5; color: #3c4248; border: 1px solid transparent; transition: all .15s;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: #bfd4fb; font-weight: 600; }

  /* 结果统计 */
  .stats { margin: 18px 2px 12px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .stats b { color: var(--text); }

  /* 卡片列表 */
  .list { display: grid; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: 0 4px 12px rgba(16,24,40,.09); }
  .new-badge { display: inline-block; background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-name { font-size: 16px; font-weight: 700; }
  .card-name .en { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .card-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
  .tag {
    font-size: 12px; padding: 2px 9px; border-radius: 6px; background: #f2f3f5; color: #4b525a;
  }
  .tag.city { background: #eef4ff; color: #2563eb; }
  .tag.role { background: #f5f0ff; color: #7c3aed; }
  .tag.ind { background: #fff7ed; color: #c2410c; }
  .status-badge, .status-select { border: 1px solid; border-radius: 6px; font-size: 12px; }
  .status-badge { display: inline-flex; align-items: center; padding: 2px 9px; font-weight: 600; }
  .status-select { padding: 4px 8px; cursor: pointer; outline: none; background: #fff; }
  .s-todo { color: #6b7280; border-color: #d1d5db; background: #f9fafb; }
  .s-applied { color: #2563eb; border-color: #bfdbfe; background: #eff6ff; }
  .s-exam { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }
  .s-interview { color: #d97706; border-color: #fde68a; background: #fffbeb; }
  .s-offer { color: #16a34a; border-color: #bbf7d0; background: #f0fdf4; }
  .s-reject { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
  .s-closed { color: #4b5563; border-color: #d1d5db; background: #f3f4f6; }
  .card-desc { font-size: 13.5px; color: #3c4248; margin: 0 0 8px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .card-meta .k { color: #b0b5bc; }
  .note { font-size: 12px; color: #b45309; background: #fffbeb; border-radius: 6px; padding: 4px 8px; margin-top: 8px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); font-weight: 600; font-size: 13.5px; text-decoration: none;
    padding: 6px 12px; border: 1px solid #d3e0fb; border-radius: 8px; background: var(--accent-soft);
    transition: background .15s;
  }
  .link-btn:hover { background: #dbe7fd; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  /* 顶部 tab */
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; }
  .tab { padding: 8px 18px; font-size: 14px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--muted); font-weight: 500; transition: all .15s; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* 简历匹配 */
  .match-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .resume-input { width: 100%; min-height: 200px; padding: 12px; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; resize: vertical; font-family: inherit; line-height: 1.7; }
  .resume-input:focus { outline: none; border-color: var(--accent); }
  .upload-zone { display: block; border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .upload-zone:hover { border-color: var(--accent); background: #f8faff; }
  .upload-hint { font-size: 14px; color: var(--muted); }
  .upload-name { margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 500; }
  .match-actions { display: flex; gap: 10px; margin: 12px 0; }
  .resume-summary { background: var(--accent-soft); border: 1px solid #d3e0fb; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .resume-summary h3, .match-results-title { margin: 0 0 8px; font-size: 14px; }
  .resume-summary .row { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .resume-summary .k { color: var(--muted); }
  .chip-mini { display: inline-block; padding: 1px 8px; border-radius: 5px; background: #fff; border: 1px solid var(--border); font-size: 12px; margin: 1px 3px 1px 0; }
  .match-result { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: #fff; }
  .match-rank { font-size: 13px; color: var(--muted); width: 30px; text-align: center; font-weight: 600; flex: 0 0 auto; }
  .match-main { flex: 1; min-width: 0; }
  .match-name { font-weight: 600; font-size: 14px; }
  .match-role { font-size: 12px; color: #7c3aed; margin-left: 6px; }
  .match-reason { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .score-wrap { display: flex; align-items: center; gap: 8px; width: 180px; flex: 0 0 auto; }
  .score-bar { flex: 1; height: 8px; border-radius: 999px; background: #eef0f3; overflow: hidden; }
  .score-fill { height: 100%; border-radius: 999px; }
  .score-num { font-weight: 700; font-size: 15px; width: 40px; text-align: right; }
  .score-high { background: #16a34a; }
  .score-mid { background: #f59e0b; }
  .score-low { background: #cbd5e1; }
  .match-empty { color: var(--muted); padding: 30px; text-align: center; font-size: 14px; }
  .advice-item { padding: 9px 12px; border-left: 3px solid #f59e0b; background: #fffbeb; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px; line-height: 1.6; }

  /* 数据看板 */
  .dash-section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .dash-title { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-label { width: 64px; font-size: 13px; color: #3c4248; flex: 0 0 auto; }
  .bar-track { flex: 1; height: 18px; background: #eef0f3; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width .3s; }
  .bar-count { width: 32px; text-align: right; font-size: 13px; font-weight: 600; color: #3c4248; flex: 0 0 auto; }
  .tbl-row { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tbl-row:last-child { border-bottom: none; }
  .tbl-status { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .tbl-n { font-size: 12px; color: var(--muted); font-weight: 400; }
  .tbl-cells { display: flex; flex-wrap: wrap; gap: 8px; }
  .tbl-item { display: inline-flex; align-items: center; gap: 6px; background: #f2f3f5; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  .tbl-role { font-size: 11px; color: #7c3aed; }

  /* 弹窗 */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .modal h2 { margin: 0 0 16px; font-size: 17px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: #4b525a; margin-bottom: 5px; }
  .field label em { color: #b0b5bc; font-style: normal; font-size: 12px; margin-left: 6px; }
  .field input, .field textarea {
    width: 100%; padding: 8px 11px; font-size: 14px; border: 1px solid var(--border); border-radius: 8px; outline: none; font-family: inherit;
  }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 52px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .hint { font-size: 12px; color: var(--muted); }
  footer { margin-top: 40px; text-align: center; font-size: 12px; color: #b0b5bc; }

  /* ===== UI 优化 ===== */
  body { background: linear-gradient(180deg, #eef2f9 0%, #f5f6f8 280px); }
  .hero {
    background: linear-gradient(135deg, #2563eb 0%, #4f46e5 60%, #7c3aed 100%);
    border-radius: 18px; padding: 24px 26px 20px; color: #fff;
    margin-bottom: 18px; box-shadow: 0 10px 30px rgba(79,70,229,.28);
  }
  .hero h1 { color: #fff; font-size: 26px; letter-spacing: .5px; }
  .hero .subtitle { color: rgba(255,255,255,.85); margin: 4px 0 0; }
  .hero .subtitle strong { color: #fff; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .hero .badge-official { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.3); }
  .hero-stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .hero-stat { background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 10px 18px; min-width: 84px; text-align: center; }
  .hs-num { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; }
  .hs-label { font-size: 12px; opacity: .85; }

  .tabs { display: flex; gap: 6px; margin: 0 0 16px; background: #e9edf3; padding: 5px; border-radius: 12px; width: fit-content; }
  .tab { padding: 8px 18px; font-size: 14px; border-radius: 9px; cursor: pointer; border: none; background: transparent; color: #5b6470; font-weight: 600; transition: all .18s; }
  .tab:hover { color: #1f2329; }
  .tab.on { background: #fff; color: #2563eb; box-shadow: 0 2px 8px rgba(16,24,40,.08); }

  .toolbar { padding: 16px 18px; border-radius: 14px; box-shadow: 0 2px 10px rgba(16,24,40,.06); }
  .btn { border-radius: 10px; font-weight: 500; }
  .btn.primary { background: linear-gradient(135deg, #2563eb, #4f46e5); border: none; box-shadow: 0 3px 10px rgba(37,99,235,.25); }
  .btn.primary:hover { background: linear-gradient(135deg, #1d4ed8, #4338ca); }

  .chip { background: #f1f3f7; border: 1px solid #e6e8ec; }
  .chip.on { background: #eef4ff; color: #2563eb; border-color: #bfd4fb; }

  .card { border-radius: 14px; border-left: 3px solid transparent; transition: box-shadow .18s, transform .18s, border-color .18s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(16,24,40,.1); border-left-color: #2563eb; }
  .card-name { font-size: 17px; }
  .tags { gap: 7px; }
  .tag { border-radius: 7px; font-size: 12px; }

  @media (max-width: 640px) {
    .wrap { padding: 16px 12px 60px; }
    .hero { padding: 18px 18px 16px; }
    .hero h1 { font-size: 21px; }
    .search-row { flex-wrap: wrap; }
    .filter-label { width: 52px; }
    .score-wrap { width: 120px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <div>
        <h1>校招岗位筛选器</h1>
        <p class="subtitle">深圳 · 香港 ｜ 仅收录<strong>企业官网</strong>投递渠道 ｜ 27届秋招</p>
      </div>
      <span class="badge-official">官网直投</span>
    </div>
    <div class="hero-stats" id="heroStats"></div>
  </header>

  <div class="tabs">
    <button class="tab on" id="tabBrowse" onclick="switchTab('browse')">岗位浏览</button>
    <button class="tab" id="tabMatch" onclick="switchTab('match')">简历匹配</button>
    <button class="tab" id="tabDash" onclick="switchTab('dash')">数据看板</button>
  </div>

  <div id="browseView">
  <div class="toolbar">
    <div class="search-row">
      <div class="search-box">
        <span class="icon"></span>
        <input id="search" type="text" placeholder="搜索公司名 / 岗位 / 行业 / JD关键词…">
      </div>
      <select id="sortSelect" class="btn">
        <option value="default">默认排序</option>
        <option value="name">按公司名</option>
        <option value="status">按投递状态</option>
      </select>
      <button class="btn ghost" id="favBtn">只看收藏</button>
      <button class="btn ghost" id="resetBtn" title="清空全部筛选">重置</button>
      <button class="btn primary" id="addBtn">＋ 新增</button>
      <button class="btn" id="exportBtn">导出</button>
      <button class="btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div class="filter-group">
      <span class="filter-label">城市</span>
      <div class="chips" id="cityChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">行业</span>
      <div class="chips" id="industryChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">岗位类别</span>
      <div class="chips" id="roleChips"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">投递状态</span>
      <div class="chips" id="statusChips"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="list" id="list"></div>
  </div>

  <div id="matchView" style="display:none">
    <div class="match-panel">
      <label class="upload-zone" for="resumeFile">
        <input type="file" id="resumeFile" accept=".pdf,.docx" hidden>
        <div class="upload-hint">点击选择简历文件（支持 PDF / Word .docx）</div>
        <div class="upload-name" id="uploadName" style="display:none"></div>
      </label>
      <div class="match-actions">
        <button class="btn primary" onclick="analyzeResume()">分析匹配</button>
        <button class="btn ghost" onclick="clearResume()">清空</button>
      </div>
      <div id="resumeSummary"></div>
      <div id="matchResults"></div>
      <div id="resumeAdvice"></div>
    </div>
  </div>

  <div id="dashView" style="display:none">
    <div class="dash-section">
      <h3 class="dash-title">投递状态分布（横版条形图）</h3>
      <div id="statusChart"></div>
    </div>
    <div class="dash-section">
      <h3 class="dash-title">投递状态明细（哪些公司 · 哪些岗位）</h3>
      <div id="statusTable"></div>
    </div>
  </div>

  <footer>数据更新于 2026-09-01 · 具体岗位 / 截止日期 / 薪资以各公司官网实时信息为准 · 数据保存在浏览器本地</footer>
</div>

<!-- 新增/编辑弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">新增公司</h2>
    <div class="field">
      <label>公司名 <em>必填</em></label>
      <input id="f_name" type="text" placeholder="如：腾讯">
    </div>
    <div class="field">
      <label>英文名 / 简称</label>
      <input id="f_en" type="text" placeholder="如：Tencent（可留空）">
    </div>
    <div class="field">
      <label>城市 <em>多个用逗号分隔</em></label>
      <input id="f_city" type="text" placeholder="深圳, 香港">
    </div>
    <div class="field">
      <label>行业 <em>多个用逗号分隔</em></label>
      <input id="f_ind" type="text" placeholder="互联网, 科技, AI, 出海, 金融">
    </div>
    <div class="field">
      <label>岗位类别 <em>多个用逗号分隔</em></label>
      <input id="f_role" type="text" placeholder="产品, 运营, 销售, 管培生, 职能">
    </div>
    <div class="field">
      <label>官网投递链接</label>
      <input id="f_url" type="text" placeholder="https://…">
    </div>
    <div class="field">
      <label>校招项目 / 岗位说明</label>
      <textarea id="f_desc" placeholder="如：2027校园招聘，产品/运营/职能方向…"></textarea>
    </div>
    <div class="field">
      <label>截止日期</label>
      <input id="f_deadline" type="text" placeholder="如：招满即止 / 以官网为准">
    </div>
    <div class="field">
      <label>薪资 <em>如有</em></label>
      <input id="f_salary" type="text" placeholder="如：以官网为准">
    </div>
    <div class="field">
      <label>备注</label>
      <input id="f_note" type="text" placeholder="如：入口以官网为准（可留空）">
    </div>
    <div class="modal-foot">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

// ============ 状态 ============
const STORAGE_KEY = "campusFilterData_v2";
let data = [];
let selectedCity = new Set();
let selectedInd = new Set();
let selectedRole = new Set();
let selectedStatus = null;
let sortBy = "default";
let onlyFav = false;
let query = "";

const ROLE_ORDER = ["产品","运营","销售","管培生","职能"];
const IND_ORDER = ["互联网","科技","AI","出海","金融","外企"];
const CITY_ORDER = ["深圳","香港"];
const STATUS_ORDER = ["待投递","已投递","已笔试","已面试","已Offer","已淘汰","已截止"];
const STATUS_CLASS = {
  "待投递":"s-todo", "已投递":"s-applied", "已笔试":"s-exam", "已面试":"s-interview",
  "已Offer":"s-offer", "已淘汰":"s-reject", "已截止":"s-closed"
};

// ============ 存储 ============
function loadData() {
  let saved = [];
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) saved = JSON.parse(raw);
  } catch (e) { /* ignore */ }
  // 以最新 SEED 为基准，合并保留用户在本地的投递状态与手动新增公司
  data = JSON.parse(JSON.stringify(SEED));
  const byName = {};
  saved.forEach(s => { byName[s.name] = s; });
  data.forEach(d => {
    const s = byName[d.name];
    if (s) {
      if (s.status) d.status = s.status;
      if (s.fav != null) d.fav = s.fav;
    }
  });
  saved.forEach(s => {
    if (!data.some(d => d.name === s.name)) data.push(s);
  });
  data.forEach(d => { if (!d.status) d.status = "待投递"; if (d.hidden == null) d.hidden = false; if (d.fav == null) d.fav = false; });
  saveData();
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ============ 渲染 ============
function uniqValues(field) {
  const s = new Set();
  data.forEach(d => (d[field] || []).forEach(v => s.add(v)));
  return s;
}
function renderChips(containerId, order, values, selected, onToggle) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  order.forEach(v => {
    if (!values.has(v)) return;
    const chip = document.createElement("div");
    chip.className = "chip" + (selected.has(v) ? " on" : "");
    chip.textContent = v;
    chip.onclick = () => { onToggle(v); render(); };
    el.appendChild(chip);
  });
}
function renderStatusChips() {
  const el = document.getElementById("statusChips");
  el.innerHTML = "";
  const all = document.createElement("div");
  all.className = "chip" + (selectedStatus == null ? " on" : "");
  all.textContent = "全部";
  all.onclick = () => { selectedStatus = null; render(); };
  el.appendChild(all);
  STATUS_ORDER.forEach(s => {
    const chip = document.createElement("div");
    chip.className = "chip" + (selectedStatus === s ? " on" : "");
    chip.textContent = s;
    chip.onclick = () => { selectedStatus = (selectedStatus === s ? null : s); render(); };
    el.appendChild(chip);
  });
}
function matches(d) {
  if (selectedCity.size && !d.city.some(c => selectedCity.has(c))) return false;
  if (selectedInd.size && !d.ind.some(i => selectedInd.has(i))) return false;
  if (selectedRole.size && !d.role.some(r => selectedRole.has(r))) return false;
  if (selectedStatus && (d.status || "待投递") !== selectedStatus) return false;
  if (query) {
    const jd = d.jd ? Object.values(d.jd).join(" ") : "";
    const hay = [d.name, d.en, d.desc, d.note, d.city.join(" "), d.ind.join(" "), d.role.join(" "), jd].join(" ").toLowerCase();
    if (!hay.includes(query.toLowerCase())) return false;
  }
  return true;
}
function sortList(list) {
  if (sortBy === "name") return list.slice().sort((a, b) => (a.name || "").localeCompare(b.name || "", "zh"));
  if (sortBy === "status") return list.slice().sort((a, b) => STATUS_ORDER.indexOf(a.status || "待投递") - STATUS_ORDER.indexOf(b.status || "待投递"));
  return list;
}
function render() {
  renderChips("cityChips", CITY_ORDER, uniqValues("city"), selectedCity,
    v => selectedCity.has(v) ? selectedCity.delete(v) : selectedCity.add(v));
  renderChips("industryChips", IND_ORDER, uniqValues("ind"), selectedInd,
    v => selectedInd.has(v) ? selectedInd.delete(v) : selectedInd.add(v));
  renderChips("roleChips", ROLE_ORDER, uniqValues("role"), selectedRole,
    v => selectedRole.has(v) ? selectedRole.delete(v) : selectedRole.add(v));
  renderStatusChips();
  updateHeroStats();

  const list = sortList(data.filter(d => matches(d) && !d.hidden && (!onlyFav || d.fav)));
  const total = data.filter(d => !d.hidden).length;
  document.getElementById("stats").innerHTML =
    `共 <b>${total}</b> 家公司 · 当前显示 <b>${list.length}</b> 家` +
    (list.length < total ? ` <span class="hint">（已筛选）</span>` : "");

  const wrap = document.getElementById("list");
  if (!list.length) {
    wrap.innerHTML = `<div class="empty">没有匹配的结果，试试放宽筛选条件或清空搜索。</div>`;
    return;
  }
  wrap.innerHTML = list.map((d, idx) => {
    const realIdx = data.indexOf(d);
    const status = d.status || "待投递";
    const statusClass = STATUS_CLASS[status] || "s-todo";
    const tags =
      `<span class="status-badge ${statusClass}">${status}</span>` +
      d.city.map(c => `<span class="tag city">${c}</span>`).join("") +
      d.ind.map(i => `<span class="tag ind">${i}</span>`).join("") +
      d.role.map(r => `<span class="tag role">${r}</span>`).join("");
    return `
    <div class="card">
      <div class="card-top">
        <div class="card-name">${esc(d.name)}<span class="en">${esc(d.en || "")}</span>${isNew(d) ? ' <span class="new-badge">NEW</span>' : ""}</div>
        <div class="card-actions">
          <select class="status-select ${statusClass}" onchange="setStatus(${realIdx}, this.value)">
            ${STATUS_ORDER.map(s => `<option value="${s}" ${s === status ? "selected" : ""}>${s}</option>`).join("")}
          </select>
          <button class="btn small fav-btn${d.fav ? " on" : ""}" onclick="toggleFav(${realIdx})">${d.fav ? "已收藏" : "收藏"}</button>
          <button class="btn small" onclick="editEntry(${realIdx})">编辑</button>
          <button class="btn small" onclick="delEntry(${realIdx})">删除</button>
        </div>
      </div>
      <div class="tags">${tags}</div>
      <p class="card-desc">${esc(d.desc || "")}</p>
      <div class="card-meta">
        <span><span class="k">截止：</span>${esc(d.deadline || "以官网为准")}</span>
        <span><span class="k">薪资：</span>${esc(d.salary || "以官网为准")}</span>
      </div>
      ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
      <div class="card-foot">
        <a class="link-btn" href="${esc(d.url || "#")}" target="_blank" rel="noopener noreferrer">官网投递 ↗</a>
        <span class="badge-official">企业官网</span>
      </div>
    </div>`;
  }).join("");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function isNew(d) {
  if (!d.addedDate) return false;
  const days = (Date.now() - new Date(d.addedDate + "T00:00:00").getTime()) / 86400000;
  return days >= 0 && days < 3;
}
function updateHeroStats() {
  const el = document.getElementById("heroStats");
  if (!el) return;
  const active = data.filter(d => !d.hidden);
  const total = active.length;
  const progress = active.filter(d => ["已投递","已笔试","已面试","已Offer"].includes(d.status || "待投递")).length;
  const offer = active.filter(d => (d.status || "待投递") === "已Offer").length;
  const newCount = active.filter(d => isNew(d)).length;
  el.innerHTML = `
    <div class="hero-stat"><span class="hs-num">${total}</span><span class="hs-label">在招公司</span></div>
    <div class="hero-stat"><span class="hs-num">${progress}</span><span class="hs-label">推进中</span></div>
    <div class="hero-stat"><span class="hs-num">${offer}</span><span class="hs-label">已 Offer</span></div>
    <div class="hero-stat"><span class="hs-num">${newCount}</span><span class="hs-label">新增</span></div>`;
}

  selectedCity.clear(); selectedInd.clear(); selectedRole.clear(); selectedStatus = null;

// 新增 / 编辑
let editingIdx = null;
function openModal(idx) {
  editingIdx = idx;
  document.getElementById("modalTitle").textContent = idx == null ? "新增公司" : "编辑公司";
  const d = idx == null ? {} : data[idx];
  document.getElementById("f_name").value = d.name || "";
  document.getElementById("f_en").value = d.en || "";
  document.getElementById("f_city").value = (d.city || []).join(", ");
  document.getElementById("f_ind").value = (d.ind || []).join(", ");
  document.getElementById("f_role").value = (d.role || []).join(", ");
  document.getElementById("f_url").value = d.url || "";
  document.getElementById("f_desc").value = d.desc || "";
  document.getElementById("f_deadline").value = d.deadline || "";
  document.getElementById("f_salary").value = d.salary || "";
  document.getElementById("f_note").value = d.note || "";
  document.getElementById("overlay").classList.add("show");
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }
document.getElementById("addBtn").onclick = () => openModal(null);
document.getElementById("cancelBtn").onclick = closeModal;
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
document.getElementById("saveBtn").onclick = () => {
  const name = document.getElementById("f_name").value.trim();
  if (!name) { alert("请填写公司名"); return; }
  const obj = {
    name,
    en: document.getElementById("f_en").value.trim(),
    city: splitList(document.getElementById("f_city").value),
    ind: splitList(document.getElementById("f_ind").value),
    role: splitList(document.getElementById("f_role").value),
    url: document.getElementById("f_url").value.trim(),
    desc: document.getElementById("f_desc").value.trim(),
    deadline: document.getElementById("f_deadline").value.trim(),
    salary: document.getElementById("f_salary").value.trim(),
    note: document.getElementById("f_note").value.trim(),
  };
  if (editingIdx == null) data.push(obj); else data[editingIdx] = obj;
  saveData(); closeModal(); render();
};
function splitList(v) { return v.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean); }

function delEntry(idx) {
  if (!confirm(`确定删除「${data[idx].name}」吗？`)) return;
  data.splice(idx, 1); saveData(); render();
}
window.editEntry = editEntry;
window.delEntry = delEntry;
window.setStatus = function(idx, val) { data[idx].status = val; saveData(); render(); };
window.toggleFav = function(idx) { data[idx].fav = !data[idx].fav; saveData(); render(); };
function editEntry(idx) { openModal(idx); }

// 导出 / 导入
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "校招官网岗位_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      if (!Array.isArray(arr)) throw new Error("格式错误");
      if (!confirm(`导入将覆盖当前 ${data.length} 条数据为 ${arr.length} 条，确认？`)) return;
      data = arr; saveData(); render();
    } catch (err) { alert("导入失败：请选择由本工具导出的 JSON 文件"); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// 优先拉取云端 data.json（托管时自动最新）；本地文件/离线则回退到内置 SEED
async function bootstrap() {
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const j = await res.json();
      if (Array.isArray(j) && j.length) SEED = j;
    }
  } catch (e) { /* 本地文件/离线：使用内置 SEED */ }
  loadData();
  render();
}
bootstrap();

  "销售": ["销售","商务拓展","商务谈判","渠道拓展","客户关系","大客户","BD","GTM","市场拓展","沟通表达","抗压能力"],
  "管培生": ["领导力","团队协作","跨部门协作","沟通表达","组织协调","快速学习","抗压能力","项目管理"],
  "职能": ["人力资源","招聘","薪酬绩效","财务","会计","审计","税务","法务","合规","行政","办公软件","Excel","PowerPoint"]
};

function extractProfile(text) {
  const t = text || "";
  const has = kws => kws.some(w => t.includes(w));
  let edu = "未识别", eduScore = 60;
  for (const k of Object.keys(EDU_TIER)) { if (t.includes(k)) { edu = k; eduScore = EDU_TIER[k]; break; } }
  const elite = SCHOOL_ELITE.filter(w => t.includes(w));
  const eduFinal = Math.min(100, eduScore + (elite.length ? 10 : 0));
  const majors = Object.keys(MAJORS).filter(k => has(MAJORS[k]));
  const skills = SKILLS.filter(w => t.includes(w));
  const certs = CERTS.filter(w => t.includes(w));
  const langs = [];
  if (/雅思|托福|专八|托业/i.test(t)) langs.push("英语(雅思/托福)");
  else if (/六级|CET-?6/i.test(t)) langs.push("英语六级");
  else if (/四级|CET-?4/i.test(t)) langs.push("英语四级");
  if (/粤语|广东话/.test(t)) langs.push("粤语");
  if (/日语|N1|N2/.test(t)) langs.push("日语");
  const intern = /实习|intern/i.test(t);
  const projects = (t.match(/项目/g) || []).length;
  const leadership = has(["主席","部长","会长","社团","学生会","班委","队长","负责人","领导"]);
  const quantified = /\d+\s*%|\d+\.?\d*\s*万|\d+\s*k\+|\d+\s*w\+/i.test(t);
  return { edu, eduFinal, elite, majors, skills, certs, langs, intern, projects, leadership, quantified };
}

// —— 评分 ——
function jdProfile(d, role) {
  if (d.jd && d.jd[role]) return String(d.jd[role]).split(/[\s,，、/]+/).filter(Boolean);
  return ROLE_PROFILE[role] || [];
}

function scoreCandidate(p, d, role) {
  const detected = new Set(p.skills);
  const profile = jdProfile(d, role);
  const jdHit = profile.length ? profile.filter(k => detected.has(k)).length / profile.length : 0.5;
  const edu = p.eduFinal / 100;
  let exp = 0;
  if (p.intern) exp += 0.4;
  if (p.projects >= 1) exp += 0.2;
  if (p.leadership) exp += 0.2;
  if (p.quantified) exp += 0.2;
  exp = Math.min(1, exp);
  let cert = 0;
  if (p.certs.length) cert += 0.5;
  if (p.langs.length) cert += 0.5;
  cert = Math.min(1, cert);
  const descHit = p.skills.length ? Math.min(1, p.skills.filter(s => (d.desc || "").includes(s)).length / 5) : 0.4;
  const score = Math.round(100 * (0.45 * jdHit + 0.15 * edu + 0.20 * exp + 0.10 * cert + 0.10 * descHit));
  return Math.max(0, Math.min(100, score));
}

function buildReason(p, d, role) {
  const parts = [];
  const profile = jdProfile(d, role);
  const hit = profile.filter(k => p.skills.includes(k));
  if (hit.length) parts.push("JD命中·" + hit.slice(0, 3).join("/"));
  parts.push("学历·" + p.edu + (p.elite.length ? "(" + p.elite[0] + ")" : ""));
  const expParts = [];
  if (p.intern) expParts.push("实习");
  if (p.projects) expParts.push("项目");
  if (p.leadership) expParts.push("社团/管理");
  if (p.quantified) expParts.push("量化成果");
  if (expParts.length) parts.push("经历·" + expParts.join("/"));
  const c = [];
  if (p.certs.length) c.push("证书");
  if (p.langs.length) c.push("语言");
  if (c.length) parts.push(c.join("/"));
  return parts.join(" ｜ ") || "综合匹配";
}

// —— 渲染 ——
function chips(arr, empty) {
  return arr.length ? arr.map(x => `<span class="chip-mini">${esc(x)}</span>`).join("") : `<span class="chip-mini" style="color:#b0b5bc">${empty || "未识别"}</span>`;
}
function renderSummary(p) {
  const expParts = [];
  if (p.intern) expParts.push("有实习");
  if (p.projects) expParts.push(p.projects + "段项目");
  if (p.leadership) expParts.push("有社团/管理");
  if (p.quantified) expParts.push("有量化成果");
  document.getElementById("resumeSummary").innerHTML = `
    <h3>我的简历（解析结果）</h3>
    <div class="row">
      <span><span class="k">学历：</span>${chips([p.edu + (p.elite.length ? "·" + p.elite[0] : "")])}</span>
      <span><span class="k">专业：</span>${chips(p.majors)}</span>
      <span><span class="k">证书：</span>${chips(p.certs)}</span>
      <span><span class="k">语言：</span>${chips(p.langs)}</span>
    </div>
    <div class="row" style="margin-top:6px"><span class="k">经历：</span>${chips(expParts)}</div>
    <div class="row" style="margin-top:6px"><span class="k">技能关键词：</span>${chips(p.skills)}</div>`;
}
function renderResults(results) {
  const el = document.getElementById("matchResults");
  if (!results.length) { el.innerHTML = '<div class="match-empty">暂无数据</div>'; return; }
  const top = results.slice(0, 60);
  const rows = top.map((x, i) => {
    const cls = x.score >= 80 ? "score-high" : (x.score >= 60 ? "score-mid" : "score-low");
    return `
    <div class="match-result">
      <div class="match-rank">#${i + 1}</div>
      <div class="match-main">
        <div class="match-name">${esc(x.name)}<span class="en">${esc(x.en || "")}</span><span class="match-role">${esc(x.role)}</span>${isNew(x) ? ' <span class="new-badge">NEW</span>' : ""}</div>
        <div class="match-reason">${esc(x.reason)}</div>
      </div>
      <div class="score-wrap">
        <div class="score-bar"><div class="score-fill ${cls}" style="width:${x.score}%"></div></div>
        <div class="score-num">${x.score}</div>
      </div>
      <a class="btn small" href="${esc(x.url || "#")}" target="_blank" rel="noopener noreferrer">投递 ↗</a>
    </div>`;
  }).join("");
  el.innerHTML = `<h3 class="match-results-title">匹配结果（按匹配度降序，共 ${results.length} 条，展示前 ${top.length}）</h3>` + rows;
}
function generateAdvice(p, results) {
  const tips = [];
  if (p.edu === "未识别") tips.push("① 未识别到「学历」。校招中学历/学校是硬性门槛（初筛可能直接卡学历），建议在简历顶部写清学校、学历、毕业时间。");
  else if (p.eduFinal < 75) tips.push("① 你的学历层级（" + p.edu + "）在部分学历要求高的岗位（金融/投行等）可能不占优，可突出学校排名/绩点/获奖弥补。");
  if (!p.majors.length) tips.push("② 未识别到「专业」。建议写清专业，专业相关度是初筛的重要维度。");
  if (p.skills.length < 3) tips.push("③ 技能关键词偏少（识别到 " + p.skills.length + " 个）。JD 关键词匹配占 45%，建议把目标岗位 JD 里的词（需求分析、数据分析、用户运营等）写进技能和经历。");
  if (!p.intern) tips.push("④ 未识别到「实习经历」。大厂 AI 筛选很看重相关实习，建议补充实习/项目（哪怕是课程项目）。");
  if (!p.quantified) tips.push("⑤ 缺少量化成果。建议把成果数字化（如『提升转化率 30%』『覆盖 10w 用户』），AI 筛选对数字更敏感。");
  if (!p.certs.length && !p.langs.length) tips.push("⑥ 未识别到证书/语言成绩。建议补充（英语六级/雅思、CFA/CPA 等），能加分。");

  const ROLE_TIP = {
    "产品": "产品岗 JD 高频词：需求分析、竞品分析、用户研究、数据分析、PRD、原型(Axure/Figma)。建议把这些词+对应经历写进简历。",
    "运营": "运营岗 JD 高频词：用户运营、活动策划、增长、转化率、社群/内容、数据分析(Excel/SQL)。",
    "销售": "销售岗 JD 高频词：业绩数字、客户关系、商务谈判、渠道拓展、抗压。",
    "管培生": "管培生 JD 高频词：领导力、团队协作、跨部门、快速学习、社团/学生会。",
    "职能": "职能岗 JD 高频词：专业证书、办公软件、流程、合规、细心。"
  };
  if (results.length) {
    const top = results.slice(0, 5);
    const topNames = [...new Set(top.map(x => x.name))].slice(0, 3);
    const topRoles = [...new Set(top.map(x => x.role))].slice(0, 3);
    topRoles.forEach(role => { if (ROLE_TIP[role]) tips.push(ROLE_TIP[role]); });
    if (topNames.length) tips.push("你匹配度最高的公司是「" + topNames.map(esc).join("、") + "」，建议优先对照这些岗位的 JD 补强关键词。");
  }
  tips.push("通用建议：关键词对齐目标 JD、成果数据化、经历按「背景—动作—结果」写、控制一页以内、避免复杂排版导致解析失败。");
  return tips;
}
function renderAdvice(tips) {
  document.getElementById("resumeAdvice").innerHTML =
    `<h3 class="match-results-title">简历修改建议</h3>` + tips.map(t => `<div class="advice-item">${t}</div>`).join("");
}

// —— 文件解析 ——
async function extractPdfText(buf) {
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const c = await page.getTextContent();
    text += c.items.map(it => it.str).join(" ") + "\n";
  }
  return text;
}
async function extractDocxText(buf) {
  const zip = await JSZip.loadAsync(buf);
  const xml = await zip.file("word/document.xml").async("string");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const paras = [...doc.getElementsByTagName("w:p")];
  return paras.map(p => [...p.getElementsByTagName("w:t")].map(t => t.textContent).join("")).join("\n");
}

// —— 主流程 ——
function runAnalysis(text) {
  const p = extractProfile(text);
  renderSummary(p);
  const results = [];
  data.filter(d => !d.hidden).forEach(d => {
    (d.role || []).forEach(role => {
      results.push({ name: d.name, en: d.en, role: role, score: scoreCandidate(p, d, role), url: d.url, reason: buildReason(p, d, role), addedDate: d.addedDate });
    });
  });
  results.sort((a, b) => b.score - a.score);
  renderResults(results);
  renderAdvice(generateAdvice(p, results));
  document.getElementById("matchResults").scrollIntoView({ behavior: "smooth", block: "start" });
}
function analyzeResume() {
  if (!resumeText) { alert("请先上传 PDF / Word 简历文件"); return; }
  runAnalysis(resumeText);
}
function clearResume() {
  resumeText = "";
  document.getElementById("resumeFile").value = "";
  document.getElementById("uploadName").style.display = "none";
  document.getElementById("resumeSummary").innerHTML = "";
  document.getElementById("matchResults").innerHTML = '<div class="match-empty">上传 PDF / Word 简历后会自动解析，即可看到与你匹配度最高的企业和岗位方向。</div>';
  document.getElementById("resumeAdvice").innerHTML = "";
}

document.getElementById("resumeFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById("uploadName").textContent = "" + f.name + "（解析中…）";
  document.getElementById("uploadName").style.display = "block";
  const reader = new FileReader();
  reader.onload = async ev => {
    const buf = ev.target.result;
    try {
      let text = "";
      const n = f.name.toLowerCase();
      if (n.endsWith(".pdf")) { await ensurePdfjs(); text = await extractPdfText(buf); }
      else if (n.endsWith(".docx")) { await ensureJszip(); text = await extractDocxText(buf); }
      else { alert("请上传 PDF 或 Word(.docx) 文件"); clearResume(); return; }
      if (!text.trim()) { alert("未能从文件中解析出文本（可能是扫描件/图片版 PDF）。"); clearResume(); return; }
      resumeText = text;
      document.getElementById("uploadName").textContent = "" + f.name + "（解析成功）";
      runAnalysis(resumeText);
    } catch (err) {
      document.getElementById("uploadName").textContent = "解析失败，请确认是 PDF 或 Word 文件";
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(f);
});

clearResume();
</script>
